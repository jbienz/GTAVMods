[ExntrcMenu]
; Keyboard key that opens or closes the menu.
OpenKey=F5

; Controller controls that open or close the menu. Hold every control except the last, then press the last.
; Specify one to four GTA Control names separated by commas, or leave empty to disable controller opening.
ControllerChord=FrontendLb,FrontendRb,FrontendLt,FrontendRt