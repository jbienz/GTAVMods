[FriendAndFoe]
; Recruits eligible NPCs within RadiusFeet into the player's crew.
RecruitKey=F6

; Makes eligible NPCs within RadiusFeet hostile to the player and crew.
HostileKey=F7

; Dismisses recruited NPCs and resets all NPCs altered by this mod.
DismissKey=F9

; Radius in feet used by the recruit and hostile commands.
RadiusFeet=30

; Distance in feet within which crew members search for threats to the player.
ThreatScanRadiusFeet=300

; Maximum number of recruited followers. GTA supports at most 7 group followers.
MaximumCrewSize=7

; Delay in milliseconds between crew and hostile combat-target updates. Minimum: 250.
CombatRefreshMilliseconds=1000

; Give a pistol and ammunition to recruits who are currently unarmed.
ArmUnarmedRecruits=true

; Allow police officers to be recruited or affected by the hostile command.
; This does not prevent recruited crew members from defending against hostile police.
IncludePolice=false

; Allow NPCs controlled by missions or scripted game events to be affected.
IncludeMissionPeds=false

; Allow non-human NPCs to be recruited or affected by the hostile command.
IncludeAnimals=false

; Allow the hostile command to turn current crew members against the player.
HostilesIncludeCrew=false