[AirStrike]
; Optional direct key used to call an air strike. Use None to disable the shortcut.
ActivationKey=None

; Number of explosions created during one air strike. Minimum: 1.
ExplosionCount=6

; Distance in meters from the player to the first explosion.
FirstExplosionDistanceMeters=9.144

; Distance in meters from the player to the final explosion.
; Explosions between the first and final positions are spaced evenly.
TotalDistanceMeters=27.432

; Delay in milliseconds between consecutive explosions. Use 0 for no delay.
ExplosionDelayMilliseconds=1000