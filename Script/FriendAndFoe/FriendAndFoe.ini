[FriendAndFoe]
; Recruits eligible human NPCs within RecruitRadius into the player's crew.
RecruitKey=F6

; Recruits eligible animals within AnimalRadius into the player's crew.
RecruitAnimalsKey=F8

; Makes eligible human NPCs within HostileRadius hostile to the player and crew.
HostileKey=F7

; Toggles whether crew members hunt animals listed in HuntedAnimals.
ToggleHuntingKey=F10

; Dismisses recruited NPCs and resets all NPCs altered by this mod.
DismissKey=F9

; Radius in meters used by the human recruit command.
RecruitRadius=9.144

; Radius in meters used by the hostile command.
HostileRadius=9.144

; Radius in meters used by the animal recruit command.
AnimalRadius=185

; Distance in meters within which crew members search for threats to the player.
ThreatScanRadiusMeters=91.44

; Maximum number of recruited followers. GTA supports at most 7 group followers.
MaximumCrewSize=7

; Delay in milliseconds between crew and hostile combat-target updates. Minimum: 250.
CombatRefreshMilliseconds=1000

; Give the configured weapon and ammunition to recruits who are currently unarmed.
ArmUnarmedRecruits=true

; WeaponHash name given to unarmed recruits. Invalid values use UpNAtomizer.
RecruitWeapon=UpNAtomizer

; Allow police officers to be recruited or affected by the hostile command.
; This does not prevent recruited crew members from defending against hostile police.
IncludePolice=false

; Allow NPCs controlled by missions or scripted game events to be affected.
IncludeMissionPeds=false

; Allow the hostile command to turn current crew members against the player.
HostilesIncludeCrew=false

; Comma-separated GTA animal model names that crew members attack while hunting is enabled.
; Defaults to wild game and birds, excluding pets and farm animals such as cats, dogs, and cows.
HuntedAnimals=a_c_boar,a_c_chickenhawk,a_c_cormorant,a_c_coyote,a_c_crow,a_c_deer,a_c_mtlion,a_c_pigeon,a_c_rabbit_01,a_c_seagull